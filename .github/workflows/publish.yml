name: Publish package to the Maven Central Repository

on:
  push:
    branches:
      - 'develop'
      - 'efx-2'

  release:
    # 'published' fires when a release is published, including when a draft
    # is published. 'created' does not fire for draft-then-publish, so it
    # would miss releases prepared as drafts.
    types: [published]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: sdk-maven-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      # Written here because setup-java cannot declare repositoryOrigins. Since Maven 3.10, the
      # credentials of a server are sent only to the hosts known for its id, and for the id central
      # that is only repo.maven.apache.org. Without central.sonatype.com, snapshots are uploaded
      # without credentials and refused.
      - name: Write the Maven settings for publishing to the Maven Central Repository
        run: |
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.3.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.3.0 https://maven.apache.org/xsd/settings-1.3.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
                <repositoryOrigins>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF
      - name: Read project version
        id: project
        shell: bash
        run: |
          version="$(mvn --batch-mode help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            -q)"
          if [[ -z "${version}" || "${version}" == *$'\n'* ]]; then
            echo "::error::Could not resolve one project version from pom.xml."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Validate publication context
        id: publication
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-publication.sh
      - name: Import GPG Key
        if: steps.publication.outputs.publish == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish to the Maven Central Repository
        if: steps.publication.outputs.publish == 'true'
        run: mvn --batch-mode deploy -Dgpg.passphrase='${{ secrets.GPG_PASSPHRASE }}' -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
